<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="styles2.css">
    </head>
    <body>
        <h1>CALCULATOR</h1>
        <input type="number" id="num1" value="5">
        <input type="number" id="num2" value="10">
        <div id="buttons">
            <button id="add" onclick="add()">ADD</button>
            <button id="sub" onclick="subtract()">SUBTRACT</button>
            <button id="mul" onclick="multiply()">MULTIPLY</button>
            <button id="div" onclick="divide()">DIVIDE</button>
        </div>
        <span id="result">RESULT: 0</span>
        <script src="calc.js"></script>
    </body>
</html>
