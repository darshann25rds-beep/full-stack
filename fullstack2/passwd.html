<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="styles5.css">
    </head>
    <body>
        <h1 id="title1">GENERATE YOUR</h1>
        <h1 id="title2">PASSWORD RIGHT NOW</h1>
        <p id="caution">Never share your password with anyone </p>
        <button id="generate" onclick="generatePassword()">GENERATE PASSWORD</button>
        <div id="hidden">
            <p id="yoo">Choose one from these</p>
            <div id="password-container">
                <div class="pass-box" id="pass1"></div>
                <div class="pass-box" id="pass2"></div>
                <div class="pass-box" id="pass3"></div>
                <div class="pass-box" id="pass4"></div>
                <div class="pass-box" id="pass5"></div>
            </div>
            <input type="password" id="new" placeholder="Enter Password">
            <input type="password" id="confirm" placeholder="Confirm Password">
            <button id="check" onclick="checkPassword()">CONFIRM PASSWORD</button>
            <p id="result"></p>
        </div>
    </body>
        <script src="passwd.js"></script>
    </body>
